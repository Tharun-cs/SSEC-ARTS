<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 48" width="160" height="48" fill="none">
  <!-- IBM 8-Bar Official Striped Logo - Mathematically Centered -->
  <g fill="#0F62FE" transform="translate(36, 8.5)">
    <!-- Letter I -->
    <rect x="0" y="0" width="16" height="3"/>
    <rect x="0" y="4" width="16" height="3"/>
    <rect x="4" y="8" width="8" height="3"/>
    <rect x="4" y="12" width="8" height="3"/>
    <rect x="4" y="16" width="8" height="3"/>
    <rect x="4" y="20" width="8" height="3"/>
    <rect x="0" y="24" width="16" height="3"/>
    <rect x="0" y="28" width="16" height="3"/>

    <!-- Letter B -->
    <rect x="22" y="0" width="22" height="3"/>
    <rect x="22" y="4" width="25" height="3"/>
    <rect x="22" y="8" width="10" height="3"/><rect x="37" y="8" width="11" height="3"/>
    <rect x="22" y="12" width="24" height="3"/>
    <rect x="22" y="16" width="24" height="3"/>
    <rect x="22" y="20" width="10" height="3"/><rect x="37" y="20" width="11" height="3"/>
    <rect x="22" y="24" width="25" height="3"/>
    <rect x="22" y="28" width="22" height="3"/>

    <!-- Letter M -->
    <rect x="54" y="0" width="8" height="3"/><rect x="80" y="0" width="8" height="3"/>
    <rect x="54" y="4" width="12" height="3"/><rect x="76" y="4" width="12" height="3"/>
    <rect x="54" y="8" width="16" height="3"/><rect x="72" y="8" width="16" height="3"/>
    <rect x="54" y="12" width="8" height="3"/><rect x="67" y="12" width="8" height="3"/><rect x="80" y="12" width="8" height="3"/>
    <rect x="54" y="16" width="8" height="3"/><rect x="67" y="16" width="8" height="3"/><rect x="80" y="16" width="8" height="3"/>
    <rect x="54" y="20" width="8" height="3"/><rect x="80" y="20" width="8" height="3"/>
    <rect x="54" y="24" width="8" height="3"/><rect x="80" y="24" width="8" height="3"/>
    <rect x="54" y="28" width="8" height="3"/><rect x="80" y="28" width="8" height="3"/>
  </g>
