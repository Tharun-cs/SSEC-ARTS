<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 48" width="160" height="48" fill="none">
  <!-- TCS Lockup - Perfectly Centered in 160x48 -->
  <g transform="translate(18, 0)">
    <!-- TCS Acronym -->
    <text x="0" y="24" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="26" font-weight="900" fill="#E81B57" dominant-baseline="central" letter-spacing="-0.8">tcs</text>
    
    <!-- Clean Vertical Divider Line -->
    <line x1="47" y1="12" x2="47" y2="36" stroke="#D1D5DB" stroke-width="1.5" stroke-linecap="round" />
    
    <!-- TATA & CONSULTANCY SERVICES Symmetrically Aligned -->
    <text x="55" y="18.5" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="900" fill="#0A1E42" dominant-baseline="central" letter-spacing="1.2">TATA</text>
    <text x="55" y="29.5" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="6.8" font-weight="800" fill="#0A1E42" dominant-baseline="central" letter-spacing="0.6">CONSULTANCY SERVICES</text>
  </g>
</svg>
